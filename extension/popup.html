<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --fg: #1e1e1e; --muted: #6b6b6b; --bg: #fff; --line: #e5e5e5; --accent: #0d99ff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --muted: #a0a0a0; --bg: #2c2c2c; --line: #444; } }
  body { width: 300px; margin: 0; padding: 16px; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 15px; margin: 0 0 12px; }
  fieldset { border: 0; padding: 0; margin: 0 0 12px; }
  legend { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
  label { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #status { min-height: 18px; margin: 10px 0 0; }
  #status.error { color: #e5484d; }
  .hint { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; margin: 10px 0 0; }
</style>
</head>
<body>
<form id="f">
  <h1>Copy to Figma</h1>
  <fieldset>
    <legend>What to copy</legend>
    <label><input type="radio" name="mode" value="full"> Full page</label>
    <label><input type="radio" name="mode" value="viewport"> Visible area</label>
    <label><input type="radio" name="mode" value="pick"> Pick an element</label>
  </fieldset>
  <fieldset>
    <legend>Options</legend>
    <label><input type="checkbox" name="lazyLoad"> Scroll first to load lazy images</label>
    <label><input type="checkbox" name="simplify"> Remove empty wrapper layers</label>
    <label><input type="checkbox" name="autoLayout"> Turn flexbox into Auto Layout (plugin only)</label>
  </fieldset>
  <fieldset>
    <legend>Output</legend>
    <label><input type="radio" name="output" value="svg"> Paste straight onto the Figma canvas</label>
    <label><input type="radio" name="output" value="copy"> Copy for the Figma plugin (Auto Layout)</label>
    <label><input type="radio" name="output" value="download"> Download .json for the plugin</label>
  </fieldset>
  <button id="go" type="submit">Capture</button>
  <p id="status" role="status"></p>
  <p class="hint">Then click the Figma canvas and press <b>Ctrl+V</b> (⌘V on Mac). Shortcut: Alt+Shift+F copies the full page.</p>
</form>
<script src="popup.js"></script>
</body>
</html>
